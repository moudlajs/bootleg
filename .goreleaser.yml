version: 2

project_name: bootleg

builds:
  - main: ./cmd/bootleg
    binary: bootleg
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE, .env.example, docs/*]

checksum:
  name_template: checksums.txt

changelog:
  # GitHub's auto-generated release notes, built from merged PR titles.
  use: github-native

release:
  draft: false
