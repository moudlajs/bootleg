name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs full history and tags to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Tests must pass before anything is published
        run: go test ./... -race

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The connector (bootleg-mcp) goes to Cloud Run once the CLI release is
  # published. deploy.yml can also be run by hand to (re)deploy any tag.
  deploy:
    needs: release
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no keys
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
