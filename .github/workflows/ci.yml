# Tests, lint, release-config check and PR title/branch conventions on PRs and main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -timeout 2m -coverprofile=coverage.out

      - name: go build
        run: go build ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.out
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new linter release can't turn main red; bump deliberately.
          version: v2.13.2

  goreleaser-check:
    # Catches a broken .goreleaser.yml before a tag push does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # The one job branch protection requires: its name, unlike matrix jobs', never changes.
  check:
    if: always()
    needs: [test, lint, goreleaser-check]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]

  conventions:
    # The PR title becomes the squash commit subject, so it must be a Conventional Commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title: $TITLE"
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|test|ci|refactor|perf|chore|build|revert)(\([a-z0-9-]+\))?!?: .+' || {
            echo "PR title must be <type>(<scope>): <subject> - see CONTRIBUTING.md"; exit 1; }

      - name: Branch name follows the convention
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "branch: $BRANCH"
          printf '%s' "$BRANCH" | grep -qE '^(feat|fix|hotfix|docs|test|ci|refactor|chore|release|dependabot)/[a-z0-9._/-]+$' || {
            echo "Branch must be <type>/<short-description>, lowercase - see CONTRIBUTING.md"; exit 1; }
