version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
  settings:
    errcheck:
      # Terminal writes: nobody to report to if they fail.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Fake tokens and httptest URLs in tests trip gosec.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
